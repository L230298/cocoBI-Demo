# Render Blueprint - cocoBI 一键部署
# 部署步骤:Render Dashboard → New → Blueprint → 选这个 repo

services:
  # ==================== 后端 (FastAPI) ====================
  - type: web
    name: cocobi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LLM_MOCK_DELAY_MS
        value: "0"  # 生产环境关掉 mock 延迟,加速响应
      - key: MAX_DATASET_SIZE_MB
        value: "10"  # 免费层磁盘小,限制大小

  # ==================== 前端 (Vite 静态站点) ====================
  - type: static
    name: cocobi-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    autoDeploy: true
    envVars:
      # 前端环境变量 - 需要部署完 backend 后回来填
      # 把 RENDER_BACKEND_URL 设为后端的 .onrender.com 完整 URL
      - key: VITE_API_BASE_URL
        sync: false  # 手动在 Render Dashboard 填: https://cocobi-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
