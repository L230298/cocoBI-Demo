# Railway 部署配置(cocobi-backend)
# Railway 通过 railway.json / railway.toml 自动识别
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# 不写 startCommand - 让 Dockerfile 的 ENTRYPOINT 自动处理
healthcheckPath = "/api/health"
healthcheckTimeout = 180  # 3 分钟给冷启动
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
