# Railway 前端配置

[build]
builder = "NIXPACKS"
# cp 内容(. 后缀)到目标目录,避免嵌套 frontend/dist/
buildCommand = "rm -rf /app/dist && mkdir -p /app/dist && cp -r frontend/dist/. /app/dist/ && ls /app/dist/assets/"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
